[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "porkyhud"
version = "0.1.1"
description = "Terminal-first Apple Silicon system HUD for macOS."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dr. Matcha Studio" }]
keywords = [
  "apple-silicon",
  "cli",
  "hardware-monitor",
  "macos",
  "powermetrics",
  "smc",
  "system-monitor",
  "terminal",
  "tui",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Mengjiehasaheart/PorkyHUD"
Repository = "https://github.com/Mengjiehasaheart/PorkyHUD"
Issues = "https://github.com/Mengjiehasaheart/PorkyHUD/issues"

[project.scripts]
porkyhud = "porkyhud:main"

[tool.setuptools]
py-modules = ["porkyhud"]
